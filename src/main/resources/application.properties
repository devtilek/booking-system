server.port=8080

# ==== PostgreSQL ====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nailstudio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# ==== File uploads ====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.dir=${UPLOAD_DIR:uploads}

# ==== Admin users ====
# Format: username:password,username:password
# Set ADMIN_USERS as an environment variable in local/production environments.
admin.users=${ADMIN_USERS:}

# ==== Telegram ====
# Optional. Leave empty to disable Telegram notifications.
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.admin.chat.ids=${TELEGRAM_ADMIN_CHAT_IDS:}
